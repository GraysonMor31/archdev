name: Build and release WSL distro

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC — tracks upstream archlinux:base
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'configure.sh'
      - 'build.sh'
      - 'root/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fakeroot
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build .wsl package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Set release tag
        id: tag
        run: echo "tag=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ArchDev ${{ steps.tag.outputs.tag }}
          files: archdev.wsl
